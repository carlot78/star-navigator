name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  gdscript-lint:
    name: GDScript lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install gdtoolkit
        run: pip install "gdtoolkit==4.*"
      - name: Lint
        run: gdlint src tests
