name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    name: GDScript lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install gdtoolkit
        run: pip install "gdtoolkit==4.*"
      - name: Lint
        run: gdlint src tests

  smoke:
    name: Headless smoke test
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.7.2
    steps:
      - uses: actions/checkout@v4
      - name: Import project
        run: godot --headless --path . --import
      - name: Run tests/smoke.gd
        run: godot --headless --path . -s res://tests/smoke.gd

  export-web:
    name: Export Web
    needs: [lint, smoke]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.7.2
    steps:
      - uses: actions/checkout@v4
      - name: Make export templates visible to this user
        run: |
          if [ "$HOME" != "/root" ]; then
            mkdir -p ~/.local/share/godot/export_templates ~/.config
            cp -r /root/.local/share/godot/export_templates/* ~/.local/share/godot/export_templates/
            cp -r /root/.config/godot ~/.config/ 2>/dev/null || true
          fi
      - name: Export
        run: |
          mkdir -p build/web
          godot --headless --path . --import
          godot --headless --path . --export-release "Web" build/web/index.html
          touch build/web/.nojekyll
          ls -la build/web
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy-pages:
    name: Publish playtest build
    needs: export-web
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  export-android:
    name: Export Android (debug APK)
    needs: [lint, smoke]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # Experimental until verified on a device; a failure here must not block the Web build.
    continue-on-error: true
    container:
      image: barichello/godot-ci:4.7.2
    steps:
      - uses: actions/checkout@v4
      - name: Make export templates and editor settings visible to this user
        run: |
          if [ "$HOME" != "/root" ]; then
            mkdir -p ~/.local/share/godot/export_templates ~/.config
            cp -r /root/.local/share/godot/export_templates/* ~/.local/share/godot/export_templates/
            cp -r /root/.config/godot ~/.config/ 2>/dev/null || true
          fi
      - name: Export
        run: |
          mkdir -p build/android
          godot --headless --path . --import
          godot --headless --path . --export-debug "Android" build/android/star-navigator.apk
          ls -la build/android
      - uses: actions/upload-artifact@v4
        with:
          name: star-navigator-debug-apk
          path: build/android/star-navigator.apk
          retention-days: 14
